version: '3.8'
services:
  api:
    image: cpf-validation-api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ENV=${ENV}
    ports:
      - "8000:8000"
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cpfdb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
