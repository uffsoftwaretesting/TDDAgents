[tool.poetry]
name = "cpf_validation_api"
version = "0.1.0"
description = "API para validação de CPFs usando FastAPI"
authors = [""]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.95.0"
pydantic = "^2.0"
pydantic-settings = "^0.2.0"
sqlalchemy = "^2.0"
asyncpg = "^0.27.0"
alembic = "^1.10.0"
validate-docbr = "^1.10.0"
uvicorn = "^0.22.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.22.0"
httpx = "^0.24.0"
ruff = "^0.0.259"
mypy = "^1.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
