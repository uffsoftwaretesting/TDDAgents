# flake8 configuration.
#
# flake8 does not read pyproject.toml, which is why this file exists separately from it.
# Everything else (pytest, mypy, mutmut) is configured there.

[flake8]
# 120 matches how this codebase is actually written. At the PEP 8 default of 79, 437 of
# the 659 findings across app/ are line-length alone, which buries the real defects.
max-line-length = 120

extend-exclude =
    .git,
    .venv,
    venv,
    mutants,
    __pycache__,
    experimental_executions,
    mutation_tests,
    backup
