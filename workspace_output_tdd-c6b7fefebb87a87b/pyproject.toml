[project]
name = "adams_bashforth_2"
version = "0.1.0"
description = "Adams–Bashforth 2 method for ODE initial value problems"
requires-python = ">=3.8"
dependencies = [
    "pytest"
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
